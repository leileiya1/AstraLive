name: astralive-integration
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astralive
      POSTGRES_USER: astralive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astralive-local-only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U astralive -d astralive"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-astralive}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-astralive-local-only}
    volumes: [minio-data:/data]
    profiles: [storage]
  mock-runtime:
    build:
      context: ..
      dockerfile: infra/mock-runtime.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_RUNTIME_EVENT_STREAM: dh.runtime.events.v1
    depends_on:
      redis: {condition: service_healthy}
    profiles: [mock]
  real-runtime:
    build:
      context: ..
      dockerfile: infra/real-runtime.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      MOCK_LLM: "true"
      MOCK_TTS: "true"
      MOCK_AVATAR: "true"
      MOCK_MEDIA: "true"
      TOOL_BASE_URL: http://backend:8080
      TOOL_TOKEN: ${INTERNAL_API_TOKEN:-astralive-local-token}
    depends_on:
      redis: {condition: service_healthy}
    profiles: [real]
  backend:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://astralive:${POSTGRES_PASSWORD:-astralive-local-only}@postgres:5432/astralive?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_RUNTIME_EVENT_STREAM: dh.runtime.events.v1
      AI_RUNTIME_URL: http://${RUNTIME_SERVICE:-mock-runtime}:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-astralive-local-token}
    ports: ["127.0.0.1:${BACKEND_PORT:-18080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_WEBRTC_STUN_URLS: ${VITE_WEBRTC_STUN_URLS:-}
        VITE_WEBRTC_TURN_URLS: ${VITE_WEBRTC_TURN_URLS:-}
        VITE_WEBRTC_TURN_USERNAME: ${VITE_WEBRTC_TURN_USERNAME:-}
        VITE_WEBRTC_TURN_CREDENTIAL: ${VITE_WEBRTC_TURN_CREDENTIAL:-}
    ports: ["127.0.0.1:${FRONTEND_PORT:-18081}:80"]
    depends_on: [backend]
volumes:
  postgres-data:
  minio-data:
