# Separate v2 Runtime service ONLY; template, Linux adversarial test pending.
[Service]
User=astralive-runtime-v2
Group=astralive-producer-ipc
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX
IPAddressDeny=any
RestrictNamespaces=yes
ProtectSystem=strict
ProtectHome=yes
ProtectProc=invisible
ProcSubset=pid
PrivateTmp=yes
UMask=0077
InaccessiblePaths=-/etc/astralive-guardian -/var/lib/astralive-guardian-v2 -/recordings
# CONTROL socket is a separate group-owned 0710 directory; Runtime must never
# join astralive-control-ipc. Agent4 provides narrow existing-protocol AF_UNIX
# Backend/Worker proxies: no GPU binary changes or general network proxy.
