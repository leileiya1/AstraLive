# Required drop-in for a SEPARATE durable Runtime service/UID. Agent 4 must
# bridge Backend/Worker via explicit protected AF_UNIX proxies. Do not attach
# the legacy Runtime to the same output target while testing this deployment.
[Service]
User=astralive-runtime
Group=astralive-ipc
NoNewPrivileges=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX
IPAddressDeny=any
RestrictNamespaces=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectProc=invisible
ProcSubset=pid
InaccessiblePaths=/etc/astralive-guardian /state /recordings
ReadOnlyPaths=/ipc
UMask=0077
