openapi: 3.0.3
info:
  title: AstraLive Go to Python Runtime API
  version: 1.1.0
  description: Internal commands accepted asynchronously by Python Runtime. Only Go may call these routes.
paths:
  /internal/v1/sessions:
    post:
      operationId: createRuntimeSession
      summary: Create a Runtime session
      requestBody:
        $ref: '#/components/requestBodies/CreateSession'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/v1/sessions/{sessionId}/start:
    post:
      operationId: startRuntimeSession
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /internal/v1/sessions/{sessionId}/utterances:
    post:
      operationId: speakRuntimeUtterance
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      requestBody: { $ref: '#/components/requestBodies/Utterance' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /internal/v1/sessions/{sessionId}/webrtc/offer:
    post:
      operationId: exchangeRuntimeWebRTCOffer
      description: 'Go forwards a complete non-trickle SDP offer. Runtime waits for ICE gathering and returns a complete SDP answer. Media bypasses Go.'
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      requestBody: { $ref: '#/components/requestBodies/WebRTCOfferBody' }
      responses: { '200': { $ref: '#/components/responses/WebRTCAnswerResult' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /internal/v1/sessions/{sessionId}/interrupt:
    post:
      operationId: interruptRuntimeSession
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      requestBody: { $ref: '#/components/requestBodies/Interrupt' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /internal/v1/sessions/{sessionId}/stop:
    post:
      operationId: stopRuntimeSession
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' }, '500': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /internal/v1/health:
    get:
      operationId: getRuntimeHealth
      responses:
        '200':
          description: Runtime health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeHealth' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    CreateSession:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateRuntimeSessionRequest' }
    Command:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeCommandRequest' }
    Utterance:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeUtteranceRequest' }
    Interrupt:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeInterruptRequest' }
    WebRTCOfferBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WebRTCOffer' }
  responses:
    Accepted:
      description: Asynchronous command accepted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeAccepted' }
    Error:
      description: Runtime command failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    WebRTCAnswerResult:
      description: Complete non-trickle SDP answer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WebRTCAnswer' }
  schemas:
    RuntimeCommandRequest:
      type: object
      required: [commandId, traceId]
      properties:
        commandId: { type: string }
        traceId: { type: string }
      additionalProperties: false
    CreateRuntimeSessionRequest:
      type: object
      required: [commandId, traceId, sessionId, avatar, voice, config, context]
      properties:
        commandId: { type: string }
        traceId: { type: string }
        sessionId: { type: string }
        avatar:
          type: object
          required: [avatarId, engine]
          properties:
            avatarId: { type: string }
            engine: { type: string, example: MOCK }
        voice:
          type: object
          required: [voiceId, provider]
          properties:
            voiceId: { type: string }
            provider: { type: string, example: MOCK }
        config:
          type: object
          required: [fps, preview]
          properties:
            fps: { type: integer, minimum: 1, example: 25 }
            preview:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [WEBRTC] }
        context: { $ref: '#/components/schemas/RuntimeSessionContext' }
      additionalProperties: false
    RuntimeSessionContext:
      type: object
      required: [roomId, systemPrompt]
      properties:
        roomId: { type: string, minLength: 1 }
        systemPrompt: { type: string }
        activeProductId: { type: string, minLength: 1 }
        knowledgeBaseId: { type: string, minLength: 1 }
      additionalProperties: false
    RuntimeUtteranceRequest:
      type: object
      required: [commandId, traceId, utteranceId, text, priority, interruptPolicy, source, voice]
      properties:
        commandId: { type: string }
        traceId: { type: string }
        utteranceId: { type: string }
        text: { type: string, minLength: 1 }
        priority: { type: integer }
        interruptPolicy: { $ref: '#/components/schemas/InterruptPolicy' }
        source: { $ref: '#/components/schemas/UtteranceSource' }
        platformContext: { $ref: '#/components/schemas/PlatformContext' }
        voice:
          type: object
          required: [voiceId]
          properties:
            voiceId: { type: string }
      additionalProperties: false
    UtteranceSource:
      type: string
      enum: [OPERATOR, PLATFORM_EVENT, AUTO_SCRIPT, SYSTEM]
    PlatformContext:
      type: object
      required: [eventType, user]
      properties:
        eventType: { type: string, enum: [COMMENT] }
        user:
          type: object
          required: [externalId, nickname]
          properties:
            externalId: { type: string, minLength: 1 }
            nickname: { type: string, minLength: 1 }
          additionalProperties: false
      additionalProperties: false
    WebRTCOffer:
      type: object
      required: [type, sdp]
      properties:
        type: { type: string, enum: [offer] }
        sdp: { type: string, minLength: 1 }
      additionalProperties: false
    WebRTCAnswer:
      type: object
      required: [type, sdp]
      properties:
        type: { type: string, enum: [answer] }
        sdp: { type: string, minLength: 1 }
      additionalProperties: false
    RuntimeInterruptRequest:
      type: object
      required: [commandId, traceId, reason]
      properties:
        commandId: { type: string }
        traceId: { type: string }
        reason: { type: string, example: OPERATOR_INTERRUPT }
      additionalProperties: false
    InterruptPolicy:
      type: string
      enum: [NONE, INTERRUPT_LOWER_PRIORITY, FORCE]
    RuntimeAccepted:
      type: object
      required: [accepted, operationId]
      properties:
        accepted: { type: boolean, enum: [true] }
        operationId: { type: string }
      additionalProperties: false
    RuntimeHealth:
      type: object
      required: [status, runtimeVersion, gpu, activeSessions, providers]
      properties:
        status: { type: string, example: UP }
        runtimeVersion: { type: string, example: 0.1.0 }
        gpu:
          type: object
          required: [available]
          properties:
            available: { type: boolean }
        activeSessions: { type: integer, minimum: 0 }
        providers: { type: object, additionalProperties: true }
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, RESOURCE_NOT_FOUND, CONFLICT, SESSION_NOT_FOUND, SESSION_NOT_READY, SESSION_ALREADY_RUNNING, SESSION_NOT_RUNNING, AVATAR_NOT_FOUND, AVATAR_NOT_READY, VOICE_NOT_FOUND, ROOM_NOT_FOUND, PRODUCT_NOT_FOUND, RUNTIME_UNAVAILABLE, RUNTIME_OVERLOADED, GPU_OUT_OF_MEMORY, LLM_FAILED, TTS_FAILED, AVATAR_RENDER_FAILED, MEDIA_OUTPUT_FAILED, WEBRTC_FAILED, INTERRUPT_FAILED, EVENT_PUBLISH_FAILED, INTERNAL_ERROR]
    ErrorResponse:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details: { type: object }
        requestId: { type: string }
        timestamp: { type: string, format: date-time, pattern: 'Z$' }
