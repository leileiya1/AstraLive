    AvatarListResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Avatar' } } } } ] }
    VoiceResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Voice' } } } ] }
    VoiceListResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Voice' } } } } ] }
    ProductResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } ] }
    ProductListResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Product' } } } } ] }
    KnowledgeBaseResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/KnowledgeBase' } } } ] }
    JobAcceptedResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Job' } } } ] }
    JobResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Job' } } } ] }
    LiveRoomResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LiveRoom' } } } ] }
    LiveRoomListResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LiveRoom' } } } } ] }
    LiveSessionResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LiveSession' } } } ] }
    SessionStartResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/Operation' }, { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/LiveSessionStatus' } } } ] } } } ] }
    OperationResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Operation' } } } ] }
    UtteranceResponse: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Utterance' } } } ] }
    ToolProductResult: { type: object, required: [ok, data], properties: { ok: { type: boolean }, data: { $ref: '#/components/schemas/Product' } } }
    ToolStockResult: { type: object, required: [ok, data], properties: { ok: { type: boolean }, data: { type: object, required: [productId, stock], properties: { productId: { type: string }, stock: { type: integer } } } } }
    ToolPriceResult: { type: object, required: [ok, data], properties: { ok: { type: boolean }, data: { type: object, required: [productId, price], properties: { productId: { type: string }, price: { type: number } } } } }
