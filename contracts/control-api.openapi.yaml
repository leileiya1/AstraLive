openapi: 3.0.3
info:
  title: AstraLive React to Go Control API
  version: 1.1.0
  description: Public Control API and Go-owned internal product Tool API. WebRTC media bypasses Go.
paths:
  /api/v1/avatars:
    post:
      operationId: createAvatar
      requestBody: { $ref: '#/components/requestBodies/CreateAvatarBody' }
      responses: { '201': { $ref: '#/components/responses/AvatarCreatedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    get:
      operationId: listAvatars
      responses: { '200': { $ref: '#/components/responses/AvatarListResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/avatars/{avatarId}:
    parameters: [ { $ref: '#/components/parameters/AvatarId' } ]
    get:
      operationId: getAvatar
      responses: { '200': { $ref: '#/components/responses/AvatarResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    delete:
      operationId: deleteAvatar
      responses: { '200': { $ref: '#/components/responses/EmptyResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/avatars/{avatarId}/prepare:
    parameters: [ { $ref: '#/components/parameters/AvatarId' } ]
    post:
      operationId: prepareAvatar
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/JobAcceptedResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '429': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/voices:
    post:
      operationId: createVoice
      requestBody: { $ref: '#/components/requestBodies/CreateVoiceBody' }
      responses: { '201': { $ref: '#/components/responses/VoiceCreatedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    get:
      operationId: listVoices
      responses: { '200': { $ref: '#/components/responses/VoiceListResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/voices/{voiceId}:
    parameters: [ { $ref: '#/components/parameters/VoiceId' } ]
    get:
      operationId: getVoice
      responses: { '200': { $ref: '#/components/responses/VoiceResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    delete:
      operationId: deleteVoice
      responses: { '200': { $ref: '#/components/responses/EmptyResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/products:
    post:
      operationId: createProduct
      requestBody: { $ref: '#/components/requestBodies/ProductBody' }
      responses: { '201': { $ref: '#/components/responses/ProductCreatedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    get:
      operationId: listProducts
      responses: { '200': { $ref: '#/components/responses/ProductListResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/products/{productId}:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    put:
      operationId: updateProduct
      requestBody: { $ref: '#/components/requestBodies/ProductBody' }
      responses: { '200': { $ref: '#/components/responses/ProductResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    get:
      operationId: getProduct
      responses: { '200': { $ref: '#/components/responses/ProductResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/knowledge-bases:
    post:
      operationId: createKnowledgeBase
      requestBody: { $ref: '#/components/requestBodies/KnowledgeBaseBody' }
      responses: { '201': { $ref: '#/components/responses/KnowledgeBaseCreatedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/knowledge-bases/{knowledgeBaseId}/documents:
    parameters: [ { $ref: '#/components/parameters/KnowledgeBaseId' } ]
    post:
      operationId: addKnowledgeDocument
      description: 'v0.2 deferred: document payload and index execution are not frozen in v1.1; this legacy placeholder is not a v0.1 acceptance gate.'
      responses: { '201': { $ref: '#/components/responses/EmptyResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/knowledge-bases/{knowledgeBaseId}/index:
    parameters: [ { $ref: '#/components/parameters/KnowledgeBaseId' } ]
    post:
      operationId: indexKnowledgeBase
      description: 'v0.2 deferred: index worker and Job completion protocol are outside the v0.1 core acceptance gate.'
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/JobAcceptedResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '429': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/jobs/{jobId}:
    get:
      operationId: getJob
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses: { '200': { $ref: '#/components/responses/JobResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-rooms:
    post:
      operationId: createLiveRoom
      requestBody: { $ref: '#/components/requestBodies/LiveRoomBody' }
      responses: { '201': { $ref: '#/components/responses/LiveRoomCreatedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    get:
      operationId: listLiveRooms
      responses: { '200': { $ref: '#/components/responses/LiveRoomListResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-rooms/{roomId}:
    parameters: [ { $ref: '#/components/parameters/RoomId' } ]
    put:
      operationId: updateLiveRoom
      requestBody: { $ref: '#/components/requestBodies/LiveRoomBody' }
      responses: { '200': { $ref: '#/components/responses/LiveRoomResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
    get:
      operationId: getLiveRoom
      responses: { '200': { $ref: '#/components/responses/LiveRoomResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-sessions:
    post:
      operationId: createLiveSession
      requestBody: { $ref: '#/components/requestBodies/CreateLiveSessionBody' }
      responses: { '201': { $ref: '#/components/responses/LiveSessionCreatedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-sessions/{sessionId}/start:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: startLiveSession
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/SessionStartAcceptedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '429': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-sessions/{sessionId}/stop:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: stopLiveSession
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: { '202': { $ref: '#/components/responses/OperationAcceptedResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '429': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-sessions/{sessionId}:
    get:
      operationId: getLiveSession
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses: { '200': { $ref: '#/components/responses/LiveSessionResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-sessions/{sessionId}/events:
    get:
      operationId: streamLiveSessionEvents
      description: 'SSE business events use the Runtime Event envelope. Heartbeat is a transport frame: event: heartbeat, data: {"timestamp":"2026-10-06T05:30:22Z"}; clients reset connection timeout and do not append it to the business timeline.'
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200':
          description: Server-sent events
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/ErrorResult' }
        '500': { $ref: '#/components/responses/ErrorResult' }
  /api/v1/live-sessions/{sessionId}/utterances:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: createUtterance
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/CreateUtteranceBody' }
      responses: { '202': { $ref: '#/components/responses/UtteranceAcceptedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '429': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-sessions/{sessionId}/webrtc/offer:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: exchangePublicWebRTCOffer
      description: 'Non-trickle ICE: complete SDP offer is forwarded by Go to Runtime; audio and video flow directly between browser and Runtime.'
      requestBody: { $ref: '#/components/requestBodies/WebRTCOfferBody' }
      responses: { '200': { $ref: '#/components/responses/WebRTCAnswerResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/live-sessions/{sessionId}/interrupt:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      operationId: interruptLiveSession
      requestBody: { $ref: '#/components/requestBodies/InterruptBody' }
      responses: { '202': { $ref: '#/components/responses/OperationAcceptedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '429': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /api/v1/dev/platform-events:
    post:
      operationId: publishDevPlatformEvent
      description: 'Development environment only. COMMENT is normalized by Go into a PLATFORM_EVENT utterance for the current LIVE or DEGRADED session of roomId. No active session returns 409 SESSION_NOT_RUNNING.'
      requestBody: { $ref: '#/components/requestBodies/PlatformEventBody' }
      responses: { '202': { $ref: '#/components/responses/UtteranceAcceptedResult' }, '400': { $ref: '#/components/responses/ErrorResult' }, '404': { $ref: '#/components/responses/ErrorResult' }, '409': { $ref: '#/components/responses/ErrorResult' }, '422': { $ref: '#/components/responses/ErrorResult' }, '429': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
  /internal/v1/tools/products/{productId}:
    get:
      operationId: toolGetProduct
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses: { '200': { $ref: '#/components/responses/ToolProductResultResponse' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /internal/v1/tools/products/{productId}/stock:
    get:
      operationId: toolGetProductStock
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses: { '200': { $ref: '#/components/responses/ToolStockResultResponse' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /internal/v1/tools/products/{productId}/price:
    get:
      operationId: toolGetProductPrice
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses: { '200': { $ref: '#/components/responses/ToolPriceResultResponse' }, '404': { $ref: '#/components/responses/ErrorResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /health/live:
    get:
      operationId: getControlLiveness
      responses: { '200': { $ref: '#/components/responses/HealthResult' }, '500': { $ref: '#/components/responses/ErrorResult' } }
  /health/ready:
    get:
      operationId: getControlReadiness
      responses: { '200': { $ref: '#/components/responses/HealthResult' }, '503': { $ref: '#/components/responses/ErrorResult' } }
components:
  parameters:
    AvatarId: { name: avatarId, in: path, required: true, schema: { type: string } }
    VoiceId: { name: voiceId, in: path, required: true, schema: { type: string } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string } }
    KnowledgeBaseId: { name: knowledgeBaseId, in: path, required: true, schema: { type: string } }
    RoomId: { name: roomId, in: path, required: true, schema: { type: string } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
  requestBodies:
    CreateAvatarBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAvatarRequest' } } } }
    CreateVoiceBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateVoiceRequest' } } } }
    ProductBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
    KnowledgeBaseBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseInput' } } } }
    LiveRoomBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LiveRoomInput' } } } }
    CreateLiveSessionBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateLiveSessionRequest' } } } }
    CreateUtteranceBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUtteranceRequest' } } } }
    InterruptBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InterruptRequest' } } } }
    PlatformEventBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformEvent' } } } }
    WebRTCOfferBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebRTCOffer' } } } }
  responses:
    ErrorResult: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    EmptyResult: { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
    AvatarCreatedResult: { description: Avatar created, content: { application/json: { schema: { $ref: '#/components/schemas/AvatarResponse' } } } }
    AvatarResult: { description: Avatar, content: { application/json: { schema: { $ref: '#/components/schemas/AvatarResponse' } } } }
    AvatarListResult: { description: Avatars, content: { application/json: { schema: { $ref: '#/components/schemas/AvatarListResponse' } } } }
    VoiceCreatedResult: { description: Voice created, content: { application/json: { schema: { $ref: '#/components/schemas/VoiceResponse' } } } }
    VoiceResult: { description: Voice, content: { application/json: { schema: { $ref: '#/components/schemas/VoiceResponse' } } } }
    VoiceListResult: { description: Voices, content: { application/json: { schema: { $ref: '#/components/schemas/VoiceListResponse' } } } }
    ProductCreatedResult: { description: Product created, content: { application/json: { schema: { $ref: '#/components/schemas/ProductResponse' } } } }
    ProductResult: { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/ProductResponse' } } } }
    ProductListResult: { description: Products, content: { application/json: { schema: { $ref: '#/components/schemas/ProductListResponse' } } } }
    KnowledgeBaseCreatedResult: { description: KnowledgeBase created, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBaseResponse' } } } }
    JobAcceptedResult: { description: Job accepted, content: { application/json: { schema: { $ref: '#/components/schemas/JobAcceptedResponse' } } } }
    JobResult: { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/JobResponse' } } } }
    LiveRoomCreatedResult: { description: LiveRoom created, content: { application/json: { schema: { $ref: '#/components/schemas/LiveRoomResponse' } } } }
    LiveRoomResult: { description: LiveRoom, content: { application/json: { schema: { $ref: '#/components/schemas/LiveRoomResponse' } } } }
    LiveRoomListResult: { description: LiveRooms, content: { application/json: { schema: { $ref: '#/components/schemas/LiveRoomListResponse' } } } }
    LiveSessionCreatedResult: { description: LiveSession created, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSessionResponse' } } } }
    LiveSessionResult: { description: LiveSession, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSessionResponse' } } } }
    SessionStartAcceptedResult: { description: Start accepted, content: { application/json: { schema: { $ref: '#/components/schemas/SessionStartResponse' } } } }
    OperationAcceptedResult: { description: Operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationResponse' } } } }
    UtteranceAcceptedResult: { description: Utterance queued, content: { application/json: { schema: { $ref: '#/components/schemas/UtteranceResponse' } } } }
    ToolProductResultResponse: { description: Product tool result, content: { application/json: { schema: { $ref: '#/components/schemas/ToolProductResult' } } } }
    ToolStockResultResponse: { description: Product stock tool result, content: { application/json: { schema: { $ref: '#/components/schemas/ToolStockResult' } } } }
    ToolPriceResultResponse: { description: Product price tool result, content: { application/json: { schema: { $ref: '#/components/schemas/ToolPriceResult' } } } }
    HealthResult: { description: Health, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
    WebRTCAnswerResult: { description: WebRTC answer, content: { application/json: { schema: { $ref: '#/components/schemas/WebRTCAnswerResponse' } } } }
  schemas:
    SuccessEnvelope:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code: { type: string, enum: [OK] }
        message: { type: string, enum: [success, accepted] }
        data: {}
        requestId: { type: string }
        timestamp: { type: string, format: date-time, pattern: 'Z$' }
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, RESOURCE_NOT_FOUND, CONFLICT, SESSION_NOT_FOUND, SESSION_NOT_READY, SESSION_ALREADY_RUNNING, SESSION_NOT_RUNNING, AVATAR_NOT_FOUND, AVATAR_NOT_READY, VOICE_NOT_FOUND, ROOM_NOT_FOUND, PRODUCT_NOT_FOUND, RUNTIME_UNAVAILABLE, RUNTIME_OVERLOADED, GPU_OUT_OF_MEMORY, LLM_FAILED, TTS_FAILED, AVATAR_RENDER_FAILED, MEDIA_OUTPUT_FAILED, WEBRTC_FAILED, INTERRUPT_FAILED, EVENT_PUBLISH_FAILED, INTERNAL_ERROR]
    ErrorResponse:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details: { type: object }
        requestId: { type: string }
        timestamp: { type: string, format: date-time, pattern: 'Z$' }
    EmptyResponse:
      allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object } } } ]
    CreateAvatarRequest:
      type: object
      required: [name, engine]
      properties:
        name: { type: string, minLength: 1 }
        engine: { type: string, example: MOCK }
      additionalProperties: false
    Avatar:
      type: object
      required: [avatarId, name, engine, status]
      properties:
        avatarId: { type: string }
        name: { type: string }
        engine: { type: string, example: MOCK }
        status: { type: string, example: CREATED }
    CreateVoiceRequest:
      type: object
      required: [name, provider, providerVoiceId]
      properties:
        name: { type: string, minLength: 1 }
        provider: { type: string, example: MOCK }
        providerVoiceId: { type: string }
      additionalProperties: false
    Voice:
      type: object
      required: [voiceId, name, provider, providerVoiceId]
      properties:
        voiceId: { type: string }
        name: { type: string }
        provider: { type: string }
        providerVoiceId: { type: string }
    ProductInput:
      type: object
      required: [name, description, price, currency, stock, sizes]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: number, minimum: 0 }
        currency: { type: string, example: CNY }
        stock: { type: integer, minimum: 0 }
        sizes: { type: array, items: { type: string } }
      additionalProperties: false
    Product:
      allOf: [ { $ref: '#/components/schemas/ProductInput' }, { type: object, required: [productId], properties: { productId: { type: string } } } ]
    KnowledgeBaseInput:
      type: object
      description: No fields were specified in CONTRACTS.md; body shape awaits CCR.
      additionalProperties: true
    KnowledgeBase:
      allOf: [ { $ref: '#/components/schemas/KnowledgeBaseInput' }, { type: object, required: [knowledgeBaseId], properties: { knowledgeBaseId: { type: string } } } ]
    LiveRoomInput:
      type: object
      required: [name, avatarId, voiceId, systemPrompt]
      properties:
        name: { type: string, minLength: 1 }
        avatarId: { type: string }
        voiceId: { type: string }
        knowledgeBaseId: { type: string }
        activeProductId: { type: string }
        systemPrompt: { type: string }
      additionalProperties: false
    LiveRoom:
      allOf: [ { $ref: '#/components/schemas/LiveRoomInput' }, { type: object, required: [roomId], properties: { roomId: { type: string } } } ]
    CreateLiveSessionRequest:
      type: object
      required: [roomId]
      properties:
        roomId: { type: string }
      additionalProperties: false
    LiveSessionStatus:
      type: string
      enum: [CREATED, PREPARING, READY, STARTING, LIVE, STOPPING, ENDED, FAILED, DEGRADED]
    LiveSession:
      type: object
      required: [sessionId, status]
      properties:
        sessionId: { type: string }
        roomId: { type: string }
        status: { $ref: '#/components/schemas/LiveSessionStatus' }
