<!doctype html><meta charset="utf-8"><div id="root"></div><script src="/audio_health.js"></script><script>
const config=TEST_CONFIG,sleep=ms=>new Promise(r=>setTimeout(r,ms)),rows=[],samples=[];
window.lab={epoch:0,log:(event,x={})=>rows.push({event,t:performance.now()/1000,...x})};
const NativePC=RTCPeerConnection,peers=[];
window.RTCPeerConnection=class extends NativePC{constructor(...a){super(...a);peers.push(this)}};
</script><script src="/product_hook.js"></script><script>
(async()=>{
 let v,stream=null,recorder=null,writes=Promise.resolve(),timer,frameCallback,segment=0,status='PASS',error;
 const c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');
 function frame(t,m){ctx.drawImage(v,0,0);let a=ctx.getImageData(0,0,192,24).data;let bits=(row,n)=>Array.from({length:n},(_,b)=>a[((row+4)*192+b*8+4)*4]>a[((row+4)*192+b*8+4)*4+1]?2**b:0).reduce((x,y)=>x+y,0);lab.log('Frame',{sequence:bits(8,24),generation:bits(16,16),mediaTime:m.mediaTime,presentationTime:m.presentationTime,expectedDisplayTime:m.expectedDisplayTime,rtpTimestamp:m.rtpTimestamp});frameCallback=v.requestVideoFrameCallback(frame)}
 async function closeRecording(){if(!recorder)return;const r=recorder;recorder=null;if(r.state!=='inactive')r.stop();await r.stopped;await writes;}
 async function recordCurrent(){await closeRecording();stream=v.srcObject;if(!stream||stream.getTracks().length<2)return;segment++;const name=segment===1?'native':'native_epoch'+lab.epoch;recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8,opus'});recorder.stopped=new Promise(resolve=>{recorder.onstop=resolve});recorder.ondataavailable=e=>{if(e.data.size)writes=writes.then(()=>fetch('/record/'+name,{method:'POST',body:e.data}))};recorder.start(1000);lab.log('ProductRecordingStart',{epoch:lab.epoch,segment});}
 try{
  await fetch('/permissions-ready');while(!lab.element||!lab.start)await sleep(20);v=lab.element;v.volume=.001;
  window.routeGuard=new SoulXAudioHealth.AudioRouteGuard(v,{log:lab.log});await routeGuard.pinBuiltIn();lab.start();
  while(!v.srcObject||v.readyState<2||v.srcObject.getTracks().length<2)await sleep(20);await v.play();await recordCurrent();frameCallback=v.requestVideoFrameCallback(frame);
  let polling=false;timer=setInterval(async()=>{if(polling)return;polling=true;try{const pc=peers.at(-1);if(pc&&pc.connectionState==='connected')samples.push({t:performance.now()/1000,epoch:lab.epoch,rows:[...(await pc.getStats()).values()].filter(x=>['inbound-rtp','media-playout'].includes(x.type))});if(v.srcObject&&v.srcObject!==stream&&v.srcObject.getTracks().length===2&&v.readyState>=2)await recordCurrent();}catch(e){error=String(e);status='FAIL';lab.log('Error',{error})}finally{polling=false}},200);
  let begin=performance.now();if(config.fault){await sleep(15000);lab.log('FaultRequested');await fetch('/fault',{method:'POST',body:'{}'});lab.log('FaultReturned');}
  await sleep(Math.max(0,config.duration*1000-(performance.now()-begin)));
 }catch(e){status='FAIL';error=String(e);lab.log('Error',{error})}
 finally{clearInterval(timer);if(frameCallback)v.cancelVideoFrameCallback(frameCallback);await closeRecording();lab.unmount?.();window.routeGuard?.dispose();await fetch('/report',{method:'POST',body:JSON.stringify({status,error,events:rows,stats:samples,epochs:peers.length,businessSession:'cpu-persistent-source-session',realProductionHook:true})});}
})();
</script>
