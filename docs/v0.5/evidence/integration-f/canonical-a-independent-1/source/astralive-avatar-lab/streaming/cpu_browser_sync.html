<!doctype html><meta charset="utf-8"><video id="v" autoplay playsinline width="512" height="512"></video><canvas id="canvas" width="512" height="512"></canvas><script src="/audio_health.js"></script><script>
(async()=>{
 const config=TEST_CONFIG,v=document.querySelector('#v'),c=document.querySelector('#canvas'),ctx=c.getContext('2d');let frameCallback=null,recovering=false,segment=0;const watch=new SoulXAudioHealth.PlayoutWatchdog({log:(event,x)=>log(event,x)});let pc,stream,rows=[],samples=[],recorders=[],writes=Promise.resolve(),timer,epoch=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const log=(event,x={})=>rows.push({event,t:performance.now()/1000,...x});
 function record(name,s){let r=new MediaRecorder(s,{mimeType:'video/webm;codecs=vp8,opus'});r.ondataavailable=e=>{if(e.data.size)writes=writes.then(()=>fetch('/record/'+name,{method:'POST',body:e.data}))};r.start(1000);recorders.push(r);}
 function frame(t,m){ctx.drawImage(v,0,0);let a=ctx.getImageData(0,0,192,24).data;let bits=(row,n)=>Array.from({length:n},(_,b)=>a[((row+4)*192+b*8+4)*4]>a[((row+4)*192+b*8+4)*4+1]?2**b:0).reduce((x,y)=>x+y,0);log('Frame',{sequence:bits(8,24),generation:bits(16,16),mediaTime:m.mediaTime,presentationTime:m.presentationTime,expectedDisplayTime:m.expectedDisplayTime,rtpTimestamp:m.rtpTimestamp});if(v.srcObject)frameCallback=v.requestVideoFrameCallback(frame)}
 async function connect(){pc=new RTCPeerConnection();stream=new MediaStream();pc.addTransceiver('audio',{direction:'recvonly'});pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>{stream.addTrack(e.track);v.srcObject=stream};await pc.setLocalDescription(await pc.createOffer());while(pc.iceGatheringState!=='complete')await sleep(20);let j=await(await fetch('/offer',{method:'POST',body:JSON.stringify(pc.localDescription)})).json();epoch=j.epoch;await pc.setRemoteDescription(j);while(pc.connectionState!=='connected'||v.readyState<2)await sleep(20);v.muted=false;v.volume=.001;await v.play();}
 let status='PASS',error;
 try{
  await fetch('/permissions-ready');
  if(config.pin){const outputs=await navigator.mediaDevices.enumerateDevices();log('OutputDiagnostics',{microphonePermission:(await navigator.permissions.query({name:'microphone'})).state,outputs:outputs.filter(x=>x.kind==='audiooutput').map(x=>({labelAvailable:!!x.label,role:/macbook|built.?in|内置/i.test(x.label)?'builtin':'other',concrete:!['','default','communications'].includes(x.deviceId)}))});window.routeGuard=new SoulXAudioHealth.AudioRouteGuard(v,{log});await window.routeGuard.pinBuiltIn();}
  async function recordingsStart(){const suffix=segment?'_epoch'+epoch:'';record('native'+suffix,stream);record('element'+suffix,v.captureStream());record('canvas'+suffix,new MediaStream([...c.captureStream(25).getVideoTracks(),...stream.getAudioTracks()]));}
  async function recordingsStop(){let r=recorders;recorders=[];await Promise.all(r.map(x=>new Promise(resolve=>{x.onstop=resolve;x.stop()})));await writes;}
  await connect();frameCallback=v.requestVideoFrameCallback(frame);await recordingsStart();
  timer=setInterval(async()=>{let s=[...(await pc.getStats()).values()].filter(x=>['inbound-rtp','media-playout','remote-outbound-rtp'].includes(x.type));let now=performance.now()/1000;samples.push({t:now,epoch,rows:s});let health=watch.sample(now,s);if(config.recover&&health?.state==='stalled'&&!recovering){recovering=true;log('WaitingForAudioOutputReturn');let deadline=performance.now()+8000;while(!watch.readyToRestart){if(performance.now()>deadline)throw Error('audio output did not resume');await sleep(100);}log('PreviewReconnectStart',{oldEpoch:epoch,preserveBusinessSession:true});if(frameCallback!==null)v.cancelVideoFrameCallback(frameCallback);await recordingsStop();await pc.close();v.pause();v.srcObject=null;segment++;await connect();watch.reset();frameCallback=v.requestVideoFrameCallback(frame);await recordingsStart();log('PreviewReconnectComplete',{newEpoch:epoch,preserveBusinessSession:true});recovering=false;}},200);
  let begin=performance.now();if(config.fault){await sleep(15000);log('FaultRequested');await fetch('/fault',{method:'POST',body:'{}'});log('FaultReturned');await sleep(Math.max(0,config.duration*1000-(performance.now()-begin)));}else await sleep(config.duration*1000);
 }catch(e){status='FAIL';error=String(e);log('Error',{error})}
 finally{clearInterval(timer);await Promise.all(recorders.map(r=>new Promise(resolve=>{r.onstop=resolve;r.stop()})));await writes;if(pc)await pc.close();window.routeGuard?.dispose();v.srcObject=null;await fetch('/report',{method:'POST',body:JSON.stringify({status,error,config,rows,stats:samples})})}
})();</script>
