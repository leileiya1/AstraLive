<!doctype html><meta charset="utf-8"><title>AstraLive real-provider Golden observer</title>
<button id="enableAudio" type="button">Enable real audio observation</button>
<video id="video" autoplay playsinline></video>
<script>
let pc, ac, recorder, audioSource, audioAnalyser, audioInputStream, audioPreflight=null, audioLifecycle=[], trackEvents=[], recorderErrors=[], audioActivation=null, recordingChain=Promise.resolve(), rows=[], audioRows=[], begun=0, stream, recordedBytes=0, recordingSequence=0, recordingStartedAt=null, chunkEvents=[];
function safeErrorName(error) {
  return ['NotAllowedError','NotSupportedError','InvalidStateError','NotReadableError','AbortError'].includes(error?.name)?error.name:'OTHER';
}
function audioState(reason) {
  const output=ac?.getOutputTimestamp?.()??{};
  return {reason,at:performance.now(),state:ac?.state??null,contextTime:ac?.currentTime??null,
    outputContextTime:output.contextTime??null,outputPerformanceTime:output.performanceTime??null,
    userActivationActive:navigator.userActivation?.isActive??false,
    userActivationSeen:navigator.userActivation?.hasBeenActive??false,
    visibilityState:document.visibilityState,hasFocus:document.hasFocus(),isSecureContext};
}
async function enableAudio() {
  if(!ac) {
    ac=new AudioContext({sampleRate:48000});
    ac.onstatechange=()=>audioLifecycle.push(audioState('statechange'));
  }
  audioLifecycle.push(audioState('before_resume'));
  await ac.resume();
  audioLifecycle.push(audioState('after_resume'));
}
document.getElementById('enableAudio').addEventListener('click',()=>{
  audioActivation=enableAudio();
  audioActivation.catch(error=>audioLifecycle.push({...audioState('resume_failed'),errorType:safeErrorName(error)}));
});
async function audioInbound() {
  let observed=null;
  for(const row of (await pc.getStats()).values())if(row.type==='inbound-rtp' && (row.kind??row.mediaType)==='audio') {
    observed={at:performance.now(),packetsReceived:row.packetsReceived??null,packetsDiscarded:row.packetsDiscarded??null,
      totalSamplesReceived:row.totalSamplesReceived??null,totalSamplesDuration:row.totalSamplesDuration??null,
      jitterBufferEmittedCount:row.jitterBufferEmittedCount??null,totalAudioEnergy:row.totalAudioEnergy??null};
  }
  return observed;
}
async function goldenAudioReady() {
  if(!ac || !audioSource || !audioActivation)throw new Error('Actual audio observer was not activated');
  await audioActivation;
  const before=audioState('preflight_start'),inboundBefore=await audioInbound();
  // Observe real clock/decoded progress; no fixed A/V delay or synthetic source.
  let after=before,inboundAfter=inboundBefore;
  while(performance.now()-before.at<1500) {
    await new Promise(resolve=>requestAnimationFrame(resolve));
    after=audioState('preflight_end');inboundAfter=await audioInbound();
    if(after.contextTime-before.contextTime>=0.1 &&
       typeof inboundAfter?.totalSamplesDuration==='number' && typeof inboundBefore?.totalSamplesDuration==='number' &&
       inboundAfter.totalSamplesDuration-inboundBefore.totalSamplesDuration>=0.1)break;
  }
  const track=stream?.getAudioTracks()[0];
  audioPreflight={before,after,contextDeltaSeconds:after.contextTime-before.contextTime,
    performanceDeltaSeconds:(after.at-before.at)/1000,
    inboundBefore,inboundAfter,
    decodedAudioDeltaSeconds:typeof inboundAfter?.totalSamplesDuration==='number' && typeof inboundBefore?.totalSamplesDuration==='number'
      ?inboundAfter.totalSamplesDuration-inboundBefore.totalSamplesDuration:null,
    trackLive:track?.readyState==='live',trackEnabled:track?.enabled===true,trackMuted:track?.muted??null};
  audioPreflight.ready=before.state==='running' && after.state==='running'
    && audioPreflight.contextDeltaSeconds>=0.1 && audioPreflight.decodedAudioDeltaSeconds>=0.1
    && audioPreflight.trackLive && audioPreflight.trackEnabled;
  return audioPreflight;
}
async function goldenStart(sessionId) {
  if(!audioActivation)throw new Error('Real user audio activation required');
  await audioActivation;
  begun=performance.now(); pc=new RTCPeerConnection({iceServers:[]});
  pc.addTransceiver('audio',{direction:'recvonly'}); pc.addTransceiver('video',{direction:'recvonly'});

  const canvas=document.createElement('canvas'); canvas.width=8; canvas.height=8;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const barcodeCanvas=document.createElement("canvas");barcodeCanvas.width=192;barcodeCanvas.height=8;
  const barcodeContext=barcodeCanvas.getContext("2d",{willReadFrequently:true});

  pc.ontrack=async ({track}) => {
    function trackState(event) {trackEvents.push({event,at:performance.now(),kind:track.kind,id:track.id,
      readyState:track.readyState,enabled:track.enabled,muted:track.muted});}
    trackState('track');for(const event of ['mute','unmute','ended'])track.addEventListener(event,()=>trackState(event));
    stream.addTrack(track); video.srcObject=stream;
    await video.play().catch(error=>trackEvents.push({event:'video_play_error',at:performance.now(),errorType:safeErrorName(error)}));
    if (track.kind==='audio' && !audioStarted) {
      audioStarted=true; await ac.resume();
      audioInputStream=new MediaStream([track]);audioSource=ac.createMediaStreamSource(audioInputStream);
      audioAnalyser=ac.createAnalyser();const analyser=audioAnalyser;
      analyser.fftSize=2048;audioSource.connect(analyser);analyser.connect(ac.destination);
      audioLifecycle.push(audioState('real_track_connected'));
      const data=new Float32Array(analyser.fftSize);
      let previous=0;
      function observeAudio() {
        analyser.getFloatTimeDomainData(data); let energy=0;
        for (const x of data) energy+=x*x;
        const rms=Math.sqrt(energy/data.length), now=performance.now();
        if (now-previous>=20) {
          const output=ac.getOutputTimestamp();
          audioRows.push({at:now,rms,contextState:ac.state,contextTime:ac.currentTime,outputContextTime:output.contextTime,outputPerformanceTime:output.performanceTime}); previous=now;
        }

      }
      observeAudio();
    }
    if (!recording && stream.getAudioTracks().length && stream.getVideoTracks().length) {
      recording=true; recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8,opus'});
      recorder.ondataavailable=e=>{
        if(!e.data.size)return;
        const sequence=recordingSequence++;recordedBytes+=e.data.size;
        chunkEvents.push({sequence,at:performance.now(),bytes:e.data.size,timecode:e.timecode});
        recordingChain=recordingChain.then(()=>new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.readAsDataURL(e.data)}))
          .then(base64=>window.__goldenRecording(sequence,base64));

      recordingStartedAt=performance.now();recorder.start(1000);
    }
  };
  function frame(now, meta) {
    if (video.readyState>=2) {
      ctx.drawImage(video,0,0,8,8);const pixels=ctx.getImageData(0,0,8,8).data;let luma=[];
      for(let i=0;i<pixels.length;i+=4)luma.push(Math.round(.299*pixels[i]+.587*pixels[i+1]+.114*pixels[i+2]));
      barcodeContext.drawImage(video,0,0,192,8,0,0,192,8);
      const band=barcodeContext.getImageData(0,0,192,8).data;let code=0,valid=true;
      for(let cell=0;cell<24;cell++){
        const off=(4*192+cell*8+4)*4,r=band[off],g=band[off+1];
        if(Math.abs(g-r)<60)valid=false;
        code=code*2+(r>g?1:0);
      }
      const body=code>>>4;let crc=0;for(let bit=0;bit<20;bit+=4)crc^=(body>>>bit)&15;
      const ordinal=body>>>8,sequence=body&255;
      const barcode=valid && crc===(code&15) && ordinal>0 && sequence<200?{ordinal,frameSequence:sequence,layoutRevision:'astralive-golden-barcode-24-v1'}:null;
      rows.push({barcode,at:now,mediaTime:meta.mediaTime,presentationTime:meta.presentationTime,
        expectedDisplayTime:meta.expectedDisplayTime,presentedFrames:meta.presentedFrames,
        luma,audioContextTime:ac?.currentTime??null});
    }
    if(pc.connectionState!=='closed') video.requestVideoFrameCallback(frame);
  }
  video.requestVideoFrameCallback(frame);
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((resolve,reject)=>{
    if(pc.iceGatheringState==='complete')return resolve();
    const timer=setTimeout(()=>reject(new Error('ICE gathering timed out')),10000);
    pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timer);resolve()}},{once:false});
  });
  const response=await fetch('/api/v1/live-sessions/'+sessionId+'/webrtc/offer',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'offer',sdp:pc.localDescription.sdp})});
  const packet=await response.json();if(!response.ok)throw new Error('WebRTC public offer failed');
  await pc.setRemoteDescription(packet.data);
}
async function goldenFinish() {
  let inbound=[];for(const row of (await pc.getStats()).values())
    if(row.type==='inbound-rtp')inbound.push({...row});
  if(recorder && recorder.state!=='inactive')await new Promise(resolve=>{recorder.onstop=resolve;recorder.stop()});
  await recordingChain;
  const result={clockDomain:'chrome_performance_ms',timeOrigin:performance.timeOrigin,startedAt:begun,endedAt:performance.now(),
    audioSampleRate:ac?.sampleRate??null,audioContextState:ac?.state??null,audioContextTime:ac?.currentTime??null,
    audioBaseLatency:ac?.baseLatency??null,audioOutputLatency:ac?.outputLatency??null,
    audioPreflight,audioLifecycle,trackEvents,recorderErrors,recorderState:recorder?.state??null,
    video:rows,audioEnergy:audioRows,inbound,
    recordedBytes,recordingChunks:recordingSequence,recordingStartedAt,chunkEvents,audienceAudible:false,
    correlatedAV:'NOT_ANALYSED: requires actual staged speech/frame reference matching'};
  pc.close(); if(ac)await ac.close();return result;
}
</script>
