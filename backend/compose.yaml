services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astralive
      POSTGRES_USER: astralive
      POSTGRES_PASSWORD: ${ASTRALIVE_DB_PASSWORD:?set ASTRALIVE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astralive -d astralive"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
  backend:
    build: .
    ports:
      - "${ASTRALIVE_HTTP_PORT:-18080}:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://astralive:${ASTRALIVE_DB_PASSWORD:?set ASTRALIVE_DB_PASSWORD}@postgres:5432/astralive?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_RUNTIME_EVENT_STREAM: dh.runtime.events.v1
      AI_RUNTIME_URL: ${AI_RUNTIME_URL:?set AI_RUNTIME_URL to a Runtime reachable from the backend container}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres-data:
